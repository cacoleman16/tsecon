name: Release

# Tag-triggered release: build the full cross-platform abi3 wheel matrix and
# an sdist, test every wheel in a clean environment, then publish to PyPI via
# trusted publishing (OIDC — no API token). One abi3 wheel per platform serves
# all Python >= 3.9. Plan: docs/roadmap/14-packaging-distribution.md.
#
# Dry-run the whole thing against Test PyPI first, before the irreversible
# production upload: run this workflow manually with `publish_to: testpypi`.
#
# The two triggers are not interchangeable, by construction:
#   * a TAG PUSH always publishes to production PyPI;
#   * a MANUAL RUN can only ever reach Test PyPI, and only when asked for.
# The `publish` job keys off `github.event_name`, not off the ref, so a manual
# run launched against a tag still cannot reach production. There is no manual
# path to production PyPI and no file to edit to get one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Manual runs only. 'none' builds and tests every wheel and uploads nowhere; 'testpypi' also uploads to Test PyPI. Production PyPI is reachable only by pushing a v* tag."
        type: choice
        options: ["none", "testpypi"]
        default: "none"

permissions:
  contents: read

# One release at a time per ref; never cancel a publish that is already
# uploading (a half-published version set cannot be re-uploaded to PyPI).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: Wheels (${{ matrix.platform.os }} / ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest,  target: x86_64,  manylinux: auto }
          - { os: ubuntu-latest,  target: aarch64, manylinux: auto }
          # macOS Apple Silicon (arm64). Intel-Mac (x86_64) wheels are NOT built:
          # the macos-13 Intel runner label queues indefinitely on GitHub Actions,
          # so Intel-Mac users install from the published sdist and compile locally
          # (they need a Rust toolchain). Restore an x86_64 row here once a working
          # Intel runner — or Apple-Silicon cross-compilation — is wired up.
          - { os: macos-latest,   target: aarch64, manylinux: "" }
          - { os: windows-latest, target: x64,     manylinux: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          maturin-version: v1.15.0
          # The manylinux container defaults to `stable`; pin it to the same
          # compiler rust-toolchain.toml and ci.yml use.
          rust-toolchain: 1.97.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          command: build
          # abi3-py39 (set in Cargo.toml) => one wheel covers all Python >= 3.9.
          # --locked: the wheel is built from the committed Cargo.lock or not at all.
          args: --release --locked --out dist
      # Upload BEFORE the smoke test. The test step pip-installs unpinned
      # packages from PyPI; nothing installed there can touch the artifact
      # that gets published, because it has already left the runner.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: bindings/python/dist/*.whl
      # Every wheel that can run on its build host is smoke-tested: Linux
      # x86_64, Windows x64, AND macOS arm64 (macos-latest is Apple Silicon,
      # so the aarch64 wheel is native there). Only the Linux aarch64 wheel
      # is cross-built and cannot be imported on the runner.
      - name: Smoke-test the built wheel (every natively runnable target)
        if: ${{ !(matrix.platform.os == 'ubuntu-latest' && matrix.platform.target == 'aarch64') }}
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest numpy scipy
          python -m pip install --no-index --find-links bindings/python/dist tsecon
          python -c "import tsecon; assert 'site-packages' in tsecon.__file__, tsecon.__file__"
          # Run in place so the tests' repo-relative fixture paths resolve.
          python -m pytest bindings/python/tests -q

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # A tag push publishes to production. A manual run publishes to Test PyPI
    # and only when `publish_to: testpypi` was chosen — the `none` default
    # builds and tests the wheels and uploads nowhere. Both conditions test
    # `github.event_name` rather than the ref, so dispatching this workflow
    # against a tag cannot reach production either.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi')
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'push' && 'https://pypi.org/project/tsecon/' || 'https://test.pypi.org/project/tsecon/' }}
    permissions:
      # OIDC identity for trusted publishing — this is the ONLY credential used;
      # there is no API token to leak. Also enables PEP 740 build attestations.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          # Named explicitly on both arms rather than left to the action's
          # default, so the upload target is readable here and a manual run can
          # never fall through to production.
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
