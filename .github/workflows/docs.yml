name: Docs

# Validate that the documentation site builds cleanly, then deploy it to
# GitHub Pages. `mkdocs build --strict` fails on any broken internal link,
# missing nav entry, or stale reference, so the deployed site can never lag
# a broken build. Deployment runs only on pushes to main and requires the
# repository's Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Source).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "bindings/python/python/tsecon/__init__.pyi"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "bindings/python/python/tsecon/__init__.pyi"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages deploys must land in push order; a cancelled deploy can leave the
# site half-updated, so never cancel-in-progress here.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Regenerate the API reference from the type stub
        run: python docs/gen_api_reference.py
      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build the site (strict — fails on a broken link or nav entry)
        run: mkdocs build --strict
      # Uploaded on every run, not only on main, so a pull request that bumps
      # this action exercises it before merge (the artifact expires after a
      # day). Only the deploy job below is restricted to pushes to main.
      - name: Upload the built site for the deploy job
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Deploy exactly what validate built — pushes to main only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
