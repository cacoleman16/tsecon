name: Docs

# Validate that the documentation site builds cleanly, then deploy it to
# GitHub Pages. `mkdocs build --strict` fails on any broken internal link,
# missing nav entry, or stale reference, so the deployed site can never lag
# a broken build. Deployment runs only on pushes to main and requires the
# repository's Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Source).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "bindings/python/python/tsecon/__init__.pyi"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "bindings/python/python/tsecon/__init__.pyi"
  workflow_dispatch:

permissions:
  contents: read

# Pages deploys must land in push order; a cancelled deploy can leave the
# site half-updated, so never cancel-in-progress here.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Regenerate the API reference from the type stub
        run: python docs/gen_api_reference.py
      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build the site (strict — fails on a broken link or nav entry)
        run: mkdocs build --strict
      - name: Upload the built site for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    # Deploy exactly what validate built — pushes to main only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
