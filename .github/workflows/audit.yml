name: Audit

# Known-advisory gate for both dependency surfaces. Runs on every PR that
# touches a manifest, weekly against main (new advisories land without a
# commit), and on demand. Fails on any vulnerability; unmaintained-crate
# warnings fail too, except those listed as accepted below.

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "bindings/python/Cargo.toml"
      - "bindings/python/pyproject.toml"
      - "docs/requirements.txt"
      - ".github/workflows/audit.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (Cargo.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2024-0436: `paste` is unmaintained; it is a build-time
      # proc-macro reached only through faer -> gemm and contributes no
      # runtime code. Drop the ignore when faer drops it.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

  pip-audit:
    name: pip-audit (docs + the CI test set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The same names ci.yml, release.yml and docs.yml install, resolved
      # fresh, so the audit covers what those jobs would actually pull today.
      - run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -r docs/requirements.txt \
            pytest mypy numpy scipy statsmodels arch scikit-learn matplotlib pandas
      - run: python -m pip_audit --strict
