[package]
name = "tsecon-ml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Penalized regression (ridge via SVD; LASSO / elastic net / adaptive LASSO via cyclical coordinate descent matching scikit-learn objectives) with information-criterion path tuning and leakage-safe time-series cross-validation (rolling / expanding origin, purged + embargoed blocked K-fold, Lopez de Prado conventions) for the tsecon time-series econometrics library"

[dependencies]
# faer is consumed through the tsecon-linalg re-export so the whole
# workspace shares one pinned version (0.24, default-features = false,
# features = ["std"]); this crate uses its thin SVD for the ridge
# closed form and the ordinary-least-squares adaptive-LASSO weights.
tsecon-linalg = { path = "../tsecon-linalg" }
# Seeded Philox streams for the random-Fourier-feature draws of
# `kernel_ridge` (same seed, bit-identical features on every platform).
tsecon-rng = { path = "../tsecon-rng" }
# The single HAC / OLS engine of the workspace: post-double-selection
# inference (`pds_lasso`) takes its Newey-West (Bartlett) sandwich standard
# errors and the `newey_west_maxlags` rule from here rather than
# reimplementing them (ROADMAP §5: one owner per capability).
tsecon-hac = { path = "../tsecon-hac" }
# Random forests: one SeedSequence-spawned Philox substream per tree (bit-
# identical at any thread count) and rayon for the tree-parallel fit, the
# same pairing tsecon-bootstrap uses for its replication driver.
rayon = "1"
# Seeded Philox streams (NumPy-compatible SeedSequence substreams) drive the
# MLP weight initialization, mini-batch shuffles, and the echo-state
# reservoir draws: every neural fit is a pure function of its `seed`.
# The optional `solver = "lbfgs"` of the MLP reuses the crate-wide L-BFGS
# (strong-Wolfe line search) rather than carrying a second quasi-Newton.
tsecon-optim = { path = "../tsecon-optim" }

[dev-dependencies]
# float_roundtrip: fixture doubles must parse to the exact bit pattern
# scikit-learn / NumPy printed, not serde_json's default 1-ulp fast path.
serde_json = { version = "1", features = ["float_roundtrip"] }
